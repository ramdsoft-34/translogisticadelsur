# nginx: ambiente de pruebas (rama csalcedo17). Pide usuario y contraseña y no se indexa. Certbot agrega el HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name dev.translogisticadelsur.com;

    root /var/www/tls-dev/frontend/dist/frontend/browser;
    index index.html;
    client_max_body_size 15m;

    auth_basic "Ambiente de pruebas";
    auth_basic_user_file /etc/nginx/tls-dev.htpasswd;

    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location /api/ {
        proxy_pass http://127.0.0.1:4200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
