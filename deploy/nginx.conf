# nginx: sitio de Translogística del Sur. Certbot agrega el bloque HTTPS (443) y la redirección.
server {
    listen 80;
    listen [::]:80;
    server_name translogisticadelsur.com www.translogisticadelsur.com;

    root /var/www/translogisticadelsur/frontend/dist/frontend/browser;
    index index.html;
    client_max_body_size 15m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location /api/ {
        proxy_pass http://127.0.0.1:4100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Sin add_header dentro de location: nginx descartaría las cabeceras de seguridad de arriba.
    # Archivos estáticos: caché de 30 días. index.html se revalida siempre (expires -1).
    location ~* \.(?:js|css|woff2?|png|webp|ico|svg)$ {
        expires 30d;
        try_files $uri =404;
    }
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
